version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🧠 Using Node $(node -v) and npm $(npm -v)"
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
