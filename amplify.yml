version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🧠 Using Node $(node -v) and npm $(npm -v)"
        - npm install vite @vitejs/plugin-react --save-dev
        - npm ci || npm install
    build:
      commands:
        - npx vite build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
