version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🧠 Using Node $(node -v) and npm $(npm -v)"
        - rm -rf node_modules dist || true
        - npm install
        - npm install vite @vitejs/plugin-react --save-dev
    build:
      commands:
        - npx vite build --config vite.config.js
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
