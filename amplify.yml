version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🧠 Using Node $(node -v) and npm $(npm -v)"
        - rm -rf node_modules dist || true
        - npm install
        # Force Vite to be globally available
        - npm install -g vite @vitejs/plugin-react
    build:
      commands:
        # Run build using global vite (bypasses npx path issue)
        - vite build --config vite.config.js
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
