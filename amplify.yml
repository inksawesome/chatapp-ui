version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🧠 Using Node $(node -v) and npm $(npm -v)"
        - rm -rf node_modules dist .vite || true
        # Install all dependencies including devDependencies
        - npm install --include=dev
        # Force Vite and plugin-react globally (safety fallback)
        - npm install -g vite @vitejs/plugin-react
        - npm rebuild vite --force || true
    build:
      commands:
        - echo "🚀 Starting Vite build..."
        - vite build --config vite.config.js
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
