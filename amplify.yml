version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🧠 Using Node $(node -v) and npm $(npm -v)"
        - rm -rf node_modules dist || true
        - npm install
        # Ensure vite and plugin-react are globally available
        - npm install -g vite @vitejs/plugin-react
        # Optional safeguard — rebuild vite if cache causes issues
        - npm rebuild vite --force || true
    build:
      commands:
        - echo "🚀 Starting Vite build..."
        - vite build --config vite.config.js
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
