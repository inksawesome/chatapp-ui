version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🧠 Using Node $(node -v) and npm $(npm -v)"
        - rm -rf node_modules dist .vite || true
        - npm ci --no-cache
    build:
      commands:
        - echo "🚀 Starting Vite build..."
        - ./node_modules/.bin/vite build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
