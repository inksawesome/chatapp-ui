version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing all dependencies including devDependencies..."
        - npm install
    build:
      commands:
        - echo "Running Vite build..."
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

